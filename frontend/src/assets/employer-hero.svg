<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Backdrop -->
  <rect width="500" height="400" rx="24" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Cyberpunk Grid Lines -->
  <g stroke="#334155" stroke-width="0.8" opacity="0.3">
    <line x1="50" y1="320" x2="450" y2="320" />
    <line x1="80" y1="350" x2="420" y2="350" />
    <line x1="120" y1="380" x2="380" y2="380" />
  </g>

  <!-- Central Employer Briefcase & Recruitment Hub -->
  <g transform="translate(250, 180)" filter="url(#glow)">
    <!-- Outer Pulsing Ring -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#neonGrad)" stroke-width="3" stroke-dasharray="12 8" opacity="0.8" />
    
    <!-- Inner Core Circle -->
    <circle cx="0" cy="0" r="55" fill="#0f172a" stroke="#475569" stroke-width="2" />

    <!-- Briefcase / Enterprise Icon -->
    <rect x="-22" y="-12" width="44" height="30" rx="4" fill="#a855f7" />
    <path d="M -10 -12 L -10 -18 C -10 -21 10 -21 10 -18 L 10 -12" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="-22" y1="-2" x2="22" y2="-2" stroke="#0f172a" stroke-width="2" />
  </g>

  <!-- Floating Analytics / Job Matching Nodes -->
  <g transform="translate(130, 110)" filter="url(#glow)">
    <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <!-- Bar Chart Icon -->
    <rect x="-7" y="0" width="3" height="10" rx="1" fill="#3b82f6" />
    <rect x="-2" y="-5" width="3" height="15" rx="1" fill="#a855f7" />
    <rect x="3" y="-10" width="3" height="20" rx="1" fill="#ec4899" />
  </g>

  <g transform="translate(370, 130)" filter="url(#glow)">
    <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <!-- Target / Match Icon -->
    <circle cx="0" cy="0" r="8" fill="none" stroke="#10b981" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="#38bdf8" />
  </g>

  <!-- Connection Links -->
  <path d="M 154 110 Q 200 150 200 150" fill="none" stroke="url(#neonGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M 346 130 Q 300 160 300 160" fill="none" stroke="url(#neonGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7" />
</svg>
