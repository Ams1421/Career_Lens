<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Backdrop -->
  <rect width="500" height="400" rx="24" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Cyberpunk Grid Lines -->
  <g stroke="#334155" stroke-width="0.8" opacity="0.3">
    <line x1="50" y1="320" x2="450" y2="320" />
    <line x1="80" y1="350" x2="420" y2="350" />
    <line x1="120" y1="380" x2="380" y2="380" />
  </g>

  <!-- Central User Profile Shield & Node Hub -->
  <g transform="translate(250, 180)" filter="url(#glow)">
    <!-- Outer Pulsing Ring -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#neonGrad)" stroke-width="3" stroke-dasharray="12 8" opacity="0.8" />
    
    <!-- Inner Core Circle -->
    <circle cx="0" cy="0" r="55" fill="#0f172a" stroke="#475569" stroke-width="2" />

    <!-- User Silhouette Icon -->
    <circle cx="0" cy="-12" r="16" fill="#a855f7" />
    <path d="M -26 22 C -26 8 -14 8 0 8 C 14 8 26 8 26 22" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Floating Security / Success Nodes -->
  <g transform="translate(130, 110)" filter="url(#glow)">
    <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <!-- Checkmark Icon -->
    <path d="M -6 -1 L -2 4 L 8 -6" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g transform="translate(370, 130)" filter="url(#glow)">
    <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
    <!-- Lock Icon -->
    <rect x="-6" y="-3" width="12" height="10" rx="2" fill="#a855f7" />
    <path d="M -4 -3 L -4 -7 C -4 -9 4 -9 4 -7 L 4 -3" fill="none" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Connection Links -->
  <path d="M 154 110 Q 200 150 200 150" fill="none" stroke="url(#neonGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M 346 130 Q 300 160 300 160" fill="none" stroke="url(#neonGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7" />
</svg>
