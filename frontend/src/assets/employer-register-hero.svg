<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Backdrop -->
  <rect width="500" height="400" rx="24" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Cyberpunk Grid Lines -->
  <g stroke="#334155" stroke-width="0.8" opacity="0.3">
    <line x1="50" y1="320" x2="450" y2="320" />
    <line x1="80" y1="350" x2="420" y2="350" />
    <line x1="120" y1="380" x2="380" y2="380" />
  </g>

  <!-- Central Enterprise Building / Registration Hub -->
  <g transform="translate(250, 180)" filter="url(#glow)">
    <!-- Outer Pulsing Ring -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#neonGrad)" stroke-width="3" stroke-dasharray="12 8" opacity="0.8" />
    
    <!-- Inner Core Circle -->
    <circle cx="0" cy="0" r="55" fill="#0f172a" stroke="#475569" stroke-width="2" />

    <!-- Corporate Tower / Plus Icon -->
    <rect x="-12" y="-22" width="24" height="44" rx="3" fill="#a855f7" />
    <line x1="-6" y1="-10" x2="6" y2="-10" stroke="#0f172a" stroke-width="2" />
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#0f172a" stroke-width="2" />
    <line x1="-6" y1="10" x2="6" y2="10" stroke="#0f172a" stroke-width="2" />
  </g>

  <!-- Floating Network Nodes -->
  <g transform="translate(130, 110)" filter="url(#glow)">
    <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <!-- User Group Icon -->
    <circle cx="0" cy="-4" r="5" fill="#38bdf8" />
    <path d="M -8 10 C -8 5 -4 5 0 5 C 4 5 8 5 8 10" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <g transform="translate(370, 130)" filter="url(#glow)">
    <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
    <!-- Checkmark Badge -->
    <path d="M -5 -1 L -1 4 L 7 -5" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Connection Links -->
  <path d="M 154 110 Q 200 150 200 150" fill="none" stroke="url(#neonGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M 346 130 Q 300 160 300 160" fill="none" stroke="url(#neonGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7" />
</svg>
