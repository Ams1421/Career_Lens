<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Holographic Floating UI Panel Backdrop -->
  <rect x="15" y="15" width="210" height="130" rx="16" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="1.5" />
  <rect x="25" y="25" width="190" height="110" rx="12" fill="#030712" fill-opacity="0.8" />

  <!-- Central Radar / Target Grid -->
  <g transform="translate(120, 80)" filter="url(#glowEffect)">
    <!-- Rotating Dashed Rings -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#neonGlow)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />
    <circle cx="0" cy="0" r="30" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="120 40" />
    
    <!-- Center AI Core Node -->
    <circle cx="0" cy="0" r="10" fill="url(#neonGlow)" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
    
    <!-- Crosshairs -->
    <line x1="-55" y1="0" x2="-40" y2="0" stroke="#38bdf8" stroke-width="2" />
    <line x1="40" y1="0" x2="55" y2="0" stroke="#38bdf8" stroke-width="2" />
    <line x1="0" y1="-55" x2="0" y2="-40" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Left Side: Mini Activity Waveform Chart -->
  <g transform="translate(35, 60)" filter="url(#glowEffect)">
    <rect x="0" y="0" width="35" height="40" rx="6" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1" />
    <!-- Waveform Bars -->
    <rect x="6" y="22" width="5" height="12" rx="2" fill="#3b82f6" />
    <rect x="14" y="14" width="5" height="20" rx="2" fill="#a855f7" />
    <rect x="22" y="8" width="5" height="26" rx="2" fill="#ec4899" />
  </g>

  <!-- Right Side: Floating AI Match Badge -->
  <g transform="translate(165, 55)" filter="url(#glowEffect)">
    <rect x="0" y="0" width="40" height="24" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="8" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#34d399">98%</text>
  </g>

  <!-- Bottom Data Line Connectors -->
  <path d="M 70 80 L 75 80 L 95 80" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.6" />
  <path d="M 145 80 L 165 80" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.6" />
</svg>
