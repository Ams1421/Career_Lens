<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Neon Glow Line Gradients -->
    <linearGradient id="neonGlow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="1" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="neonGlow2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Backdrop -->
  <rect width="600" height="450" rx="24" fill="url(#panelBg)" />
  <rect x="2" y="2" width="596" height="446" rx="22" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Cyberpunk Grid Floor / Background Lines -->
  <g opacity="0.15">
    <path d="M 0 350 L 600 350 M 0 380 L 600 380 M 0 410 L 600 410" stroke="#a855f7" stroke-width="1" />
    <path d="M 150 320 L 50 450 M 250 320 L 200 450 M 350 320 L 400 450 M 450 320 L 550 450" stroke="#3b82f6" stroke-width="1" />
  </g>

  <!-- Central AI Scanner / Holographic Target -->
  <g transform="translate(300, 200)" filter="url(#glowEffect)">
    <!-- Outer Rotating Ring -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="url(#neonGlow2)" stroke-width="2.5" stroke-dasharray="12 8" opacity="0.7" />
    
    <!-- Middle Core Ring -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#a855f7" stroke-width="4" stroke-linecap="round" stroke-dasharray="220 100" />

    <!-- Inner Scanner Eye -->
    <circle cx="0" cy="0" r="45" fill="#030712" stroke="#38bdf8" stroke-width="2" />
    <circle cx="0" cy="0" r="18" fill="url(#neonGlow2)" />

    <!-- Crosshair Pointers -->
    <path d="M -110 0 L -85 0 M 85 0 L 110 0 M 0 -110 L 0 -85 M 0 85 L 0 110" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Floating Data Waveforms / Analytics Graph -->
  <g transform="translate(80, 70)">
    <!-- Mini Metric Badge 1 -->
    <rect x="0" y="0" width="130" height="40" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <circle cx="20" cy="20" r="6" fill="#10b981" filter="url(#glowEffect)" />
    <text x="35" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">AI Match: 98%</text>
  </g>

  <g transform="translate(390, 70)">
    <!-- Mini Metric Badge 2 -->
    <rect x="0" y="0" width="130" height="40" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <circle cx="20" cy="20" r="6" fill="#3b82f6" filter="url(#glowEffect)" />
    <text x="35" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">ATS Optimized</text>
  </g>

  <!-- Bottom Glowing Waveform Line -->
  <path d="M 50 360 Q 150 300 250 360 T 450 360 T 550 320" fill="none" stroke="url(#neonGlow1)" stroke-width="4" stroke-linecap="round" filter="url(#glowEffect)" />
</svg>
